<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pantheon · Thần thoại Hy Lạp 3D</title>

<!-- restore saved theme before paint -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("pantheon-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>

<!-- fonts: display alternates + body + UI (all with Vietnamese support where text is Vietnamese) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=EB+Garamond:ital@0;1&family=Noto+Serif:ital,wght@0,400;0,500;1,400&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="assets/css/styles.css?v=2" />
<style>
  /* highlight pulse when jumping to a god via relation chip */
  @keyframes pulseRing {
    0% { box-shadow: 0 0 0 0 rgba(168,127,60,0); }
    25% { box-shadow: 0 0 0 6px rgba(168,127,60,0.35); }
    100% { box-shadow: 0 0 0 0 rgba(168,127,60,0); }
  }
  .god-row.pulse .god-niche { animation: pulseRing 1.4s ease-out; }
</style>
</head>
<body>
<canvas id="scene-canvas"></canvas>
<div id="app"></div>

<!-- Three.js r128 (UMD globals) + non-module OrbitControls & GLTFLoader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- React + Babel (pinned) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- data + 3D stage (plain JS) -->
<script src="data/gods.js"></script>
<script src="js/statue-viewer.js"></script>

<!-- React components -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="js/gallery.jsx"></script>
<script type="text/babel" src="js/family-tree.jsx"></script>

<!-- app -->
<script type="text/babel">
const FONT_MAP = {
  "Cinzel": '"Cinzel", serif',
  "Cormorant": '"Cormorant Garamond", serif',
  "Playfair": '"Playfair Display", serif',
  "EB Garamond": '"EB Garamond", serif'
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "displayFont": "Cinzel",
  "autoRotate": true,
  "dramaticLight": false
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // theme
  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", t.theme);
    try { localStorage.setItem("pantheon-theme", t.theme); } catch (e) {}
  }, [t.theme]);

  // display font
  React.useEffect(() => {
    document.documentElement.style.setProperty("--font-display", FONT_MAP[t.displayFont] || FONT_MAP.Cinzel);
  }, [t.displayFont]);

  // 3D tweaks (stage may mount a tick later — re-apply on each change)
  React.useEffect(() => {
    const apply = () => { if (window.__stage) { window.__stage.setAutoRotate(t.autoRotate); return true; } return false; };
    if (!apply()) { const id = setInterval(() => { if (apply()) clearInterval(id); }, 120); return () => clearInterval(id); }
  }, [t.autoRotate]);

  React.useEffect(() => {
    const apply = () => { if (window.__stage) { window.__stage.setLightBoost(t.dramaticLight ? 1.5 : 1); return true; } return false; };
    if (!apply()) { const id = setInterval(() => { if (apply()) clearInterval(id); }, 120); return () => clearInterval(id); }
  }, [t.dramaticLight]);

  return (
    <React.Fragment>
      <TopBar />
      <Hero />
      <Gallery />
      <FamilyTree />
      <Footer />

      <TweaksPanel>
        <TweakSection label="Giao diện · Appearance" />
        <TweakRadio label="Theme" value={t.theme} options={["light", "dark"]}
                    onChange={(v) => setTweak("theme", v)} />
        <TweakSelect label="Font tiêu đề · Display font" value={t.displayFont}
                     options={["Cinzel", "Cormorant", "Playfair", "EB Garamond"]}
                     onChange={(v) => setTweak("displayFont", v)} />
        <TweakSection label="Tượng 3D · Statues" />
        <TweakToggle label="Tự xoay · Auto-rotate" value={t.autoRotate}
                     onChange={(v) => setTweak("autoRotate", v)} />
        <TweakToggle label="Ánh sáng kịch tính · Dramatic light" value={t.dramaticLight}
                     onChange={(v) => setTweak("dramaticLight", v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>

<!-- direct-edit style overrides -->
<style id="__om-edit-overrides"></style>
</body>
</html>
