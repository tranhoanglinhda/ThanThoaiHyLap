<!-- restore saved theme before paint -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("pantheon-theme");
      document.documentElement.setAttribute("data-theme", t || "dark");
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>
